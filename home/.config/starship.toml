format = """
$username$hostname$directory$git_branch$git_status
$character
"""

[directory]
style = "bold white"
truncation_length = 8

[git_branch]
symbol = "󰘬 "
style = "bright-black"

[git_status]
style = "bright-black"

[character]
success_symbol = "[❯](white)"
error_symbol = "[❯](bold white)"

[username]
show_always = true
style_user = "bold yellow"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold white"
format = "@[$hostname]($style) "
